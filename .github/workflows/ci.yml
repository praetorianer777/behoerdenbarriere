name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: behoerdenbarriere
          POSTGRES_PASSWORD: behoerdenbarriere
          POSTGRES_DB: behoerdenbarriere
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U behoerdenbarriere"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # Chrome runs on the runner's own network, not as a service container. The
      # browser tests serve their fixtures from a local httptest server, and a
      # container on the bridge network cannot reach the runner's loopback — the
      # scans failed with ERR_CONNECTION_REFUSED.
      - name: Chrome starten
        run: |
          docker run -d --name chrome --network host --shm-size=1g \
            chromedp/headless-shell:stable
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9222/json/version >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9222/json/version >/dev/null

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Formatierung
        working-directory: backend
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Statische Prüfung
        working-directory: backend
        run: go vet ./...

      # Datenbank- und Browsertests laufen mit: ohne sie bliebe genau das ungeprüft,
      # worauf es ankommt — das SQL und der echte Browser.
      - name: Tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://behoerdenbarriere:behoerdenbarriere@localhost:5432/behoerdenbarriere?sslmode=disable
          CHROME_URL: http://localhost:9222
        run: go test -race ./...

  # Compiling says nothing about whether the thing starts: the Go version in the
  # Dockerfile had drifted away from go.mod and no image built at all, which only
  # showed when someone ran the stack by hand.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Images bauen
        run: docker compose build

      # Die Betriebsfassung wird nie in der CI gestartet, aber ein Tippfehler darin
      # fällt sonst erst auf dem Server auf — und dort mit einer Seite, die nicht mehr
      # hochkommt.
      - name: Betriebsfassung prüfen
        run: ./deploy/check-compose.sh

      # Ob der kurze Befehl aus der Anleitung in einer Installation auch das tut, was
      # dort steht. Er tat es nicht, und das fiel erst auf dem Server auf.
      - name: Kurzbefehl prüfen
        run: ./deploy/check-kurzbefehl.sh

      # Was die Anleitung zu starten aufträgt, muss im Image auch liegen. Steht in
      # verschiedenen Dateien und ist genau deshalb schon einmal auseinandergelaufen.
      - name: Werkzeuge im Image prüfen
        run: ./deploy/check-image.sh

  # Die übrigen Jobs prüfen das Produkt. Dieser prüft die Installation: Er fährt die
  # Betriebsfassung mit den Images aus diesem Stand hoch, spielt die Behördenliste ein
  # und fragt die Seite durch ihr eigenes nginx — den Weg, den die Anleitung beschreibt
  # und den bis dahin nur ein Mensch auf einem Server gegangen ist.
  installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Frische Installation prüfen
        run: ./deploy/check-installation.sh

  # Veröffentlicht wird erst, wenn alles grün ist: Was unter "latest" liegt, hat die
  # vollständige Prüfung bestanden — einschließlich der Barrierefreiheit der eigenen
  # Seite. Der Server zieht sich die Images selbst, deshalb braucht GitHub keinen
  # Zugang zu ihm.
  release:
    needs: [backend, frontend, e2e, images, accessibility, installation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
            target: api
          - name: worker
            context: ./backend
            target: worker
          - name: frontend
            context: ./frontend
            target: ""
          - name: lighthouse
            context: ./lighthouse
            target: ""
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Zwei Marken: "latest" für den Server, der Commit für den Fall, dass man
      # zurückmuss und genau wissen will, worauf.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: |
            VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/behoerdenbarriere-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/behoerdenbarriere-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # Oberfläche, Layout und Barrierefreiheit im echten Browser, auf Desktop, Telefon
  # und bei 320 px. Der Komponententest im jsdom sieht weder Kontraste noch die
  # tatsächliche Breite einer Überschrift.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - name: Browser installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-End-Tests
        working-directory: frontend
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Zusätzlich prüft der eigene Scanner die gebaute Seite — dieselbe Prüfung, die die
  # Behörden bekommen, auf uns selbst angewandt. Ausgeliefert wird dabei das echte
  # Frontend-Image: Ein einfacher Dateiserver kennt die Routen der Anwendung nicht und
  # liefert für /barrierefreiheit eine 404-Seite, die jede Prüfung bestehen würde.
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Chrome starten
        run: |
          docker run -d --name chrome --network host --shm-size=1g \
            chromedp/headless-shell:stable
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9222/json/version >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9222/json/version >/dev/null

      - name: Seite ausliefern
        run: |
          docker build -t behoerdenbarriere-frontend ./frontend
          docker run -d --name frontend --network host behoerdenbarriere-frontend
          for _ in $(seq 1 30); do
            curl -sf http://localhost/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost/ >/dev/null

      - name: Eigene Seite prüfen
        working-directory: backend
        env:
          CHROME_URL: http://localhost:9222
        run: go run ./cmd/scan -url http://localhost/ -strict

      # Wer von 426 Behörden eine Erklärung zur Barrierefreiheit verlangt, muss die
      # eigene vorzeigen können — geprüft mit demselben Programm.
      - name: Eigene Erklärung zur Barrierefreiheit prüfen
        working-directory: backend
        env:
          CHROME_URL: http://localhost:9222
        run: go run ./cmd/statement -url http://localhost/barrierefreiheit -strict
