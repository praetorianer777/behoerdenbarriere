server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Die Anwendung bringt ihre Routen selbst mit; jede unbekannte Adresse bekommt
    # index.html und wird dort aufgelöst.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Der Name wird bei jeder Anfrage aufgelöst, nicht einmal beim Start. Sonst
        # startet nginx gar nicht, solange die API fehlt — und klebt im Betrieb an der
        # alten Adresse, wenn der API-Container eine neue bekommt.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
